<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ريڤيو الشطرنج</title>
<style>
:root{--bg:#f2f0ec;--pn:#fff;--tx:#1d1d1b;--mu:#6d6a64;--ln:#dcd8d0;--ac:#2f5d50;--sl:#e9e5da;--sd:#6b8f7b}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c1b;--pn:#252726;--tx:#ebe9e4;--mu:#a29e95;--ln:#383b39;--ac:#6fb59f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .6em}
section{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
textarea{width:100%;height:110px;border:1px solid var(--ln);border-radius:8px;padding:8px;background:var(--bg);color:var(--tx);font:13px monospace;direction:ltr;resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
button,select{font:inherit;border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#go,#exb{background:var(--ac);color:#fff;border-color:var(--ac)}
#st{color:var(--mu);margin:8px 0 0;min-height:1.6em}
.cols{display:grid;gap:16px}
@media(min-width:820px){.cols{grid-template-columns:minmax(0,560px) 1fr}}
.who{font-weight:600;padding:4px 2px;direction:ltr;text-align:left}
.bx{display:flex;gap:8px;direction:ltr}
#ev{width:18px;background:#2b2b2b;border-radius:4px;display:flex;overflow:hidden}
#evw{background:#f4f4f4;width:100%;transition:height .25s}
#bd{position:relative;flex:1;aspect-ratio:1;border-radius:6px;overflow:hidden}
#cells{display:grid;grid-template-columns:repeat(8,1fr);width:100%;height:100%}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:min(9vw,52px);line-height:1}
.sq.l{background:var(--sl)}.sq.d{background:var(--sd)}
.sq.hl::after{content:"";position:absolute;inset:0;background:rgba(255,214,0,.38)}
.sq i{font-style:normal;position:relative;z-index:1}
.sq i.w{color:#fff;text-shadow:0 0 2px #000,0 0 1px #000,0 0 1px #000}
.sq i.b{color:#161616}
.bdg{position:absolute;z-index:2;top:1px;right:1px;min-width:18px;height:18px;border-radius:9px;color:#fff;font:700 11px/18px system-ui;text-align:center;padding:0 3px}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.nav{display:flex;gap:8px;justify-content:center;margin-top:10px;direction:ltr}
.nav button{min-width:48px}
#info{min-height:3.2em;font-weight:600}
#info small{display:block;color:var(--mu);font-weight:400}
#ex{margin:10px 0;min-height:1.6em;white-space:pre-wrap}
#gr{width:100%;height:80px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);cursor:pointer;margin-top:8px}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.92rem}
td,th{padding:3px 6px;text-align:center;border-bottom:1px solid var(--ln)}
td:first-child,th:first-child{text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-left:6px}
#ml{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;max-height:200px;overflow:auto}
#ml .n{color:var(--mu);padding:6px 2px}
#ml button{padding:3px 8px;border-color:transparent;background:transparent}
#ml button::before{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;background:var(--c);margin-right:5px}
#ml button.on{background:var(--ac);color:#fff}
</style>
</head>
<body>
<main>
<h1>ريڤيو الشطرنج</h1>
<section>
  <textarea id="pgn" placeholder="الصق الـPGN هنا" aria-label="PGN"></textarea>
  <div class="row">
    <label>العمق <select id="depth"><option>10</option><option selected>12</option><option>14</option><option>18</option></select></label>
    <button id="go">حلّل</button>
  </div>
  <p id="st"></p>
</section>
<section id="rv" hidden>
  <div class="cols">
    <div>
      <div class="who" id="top"></div>
      <div class="bx">
        <div id="ev"><div id="evw"></div></div>
        <div id="bd"><div id="cells"></div><svg id="ar" viewBox="0 0 8 8"></svg></div>
      </div>
      <div class="who" id="bot"></div>
      <div class="nav">
        <button id="b0" aria-label="البداية">⏮</button><button id="b1" aria-label="السابق">◀</button>
        <button id="b2" aria-label="التالي">▶</button><button id="b3" aria-label="النهاية">⏭</button>
        <button id="fl" aria-label="قلب الرقعة">⇅</button>
      </div>
    </div>
    <div>
      <div id="info"></div>
      <button id="exb">اشرح هذه النقلة</button>
      <div id="ex"></div>
      <svg id="gr" viewBox="0 0 600 80" preserveAspectRatio="none"></svg>
      <div id="sum"></div>
      <div id="ml"></div>
    </div>
  </div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const VAL={p:1,n:3,b:3,r:5,q:9,k:99};
const CL={brilliant:['!!','#1baca6','رائعة'],great:['!','#5b8bb2','قوية'],best:['★','#7aa33a','الأفضل'],excellent:['✓','#7aa33a','ممتازة'],good:['•','#8f8f8f','جيدة'],inacc:['?!','#d9a400','دقة ضعيفة'],mistake:['?','#e0801f','خطأ'],blunder:['??','#c83431','خطأ فادح']};
const win=cp=>50+50*(2/(1+Math.exp(-0.00368208*cp))-1);
const uci=m=>m.from+m.to+(m.promotion||'');
const fmt=cp=>Math.abs(cp)>=9000?(cp>0?'+':'-')+'M'+(10000-Math.abs(cp)):(cp>0?'+':'')+(cp/100).toFixed(1);
let S=null,sf=null;

async function engine(){
  if(sf)return;
  const t=await(await fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')).text();
  sf=new Worker(URL.createObjectURL(new Blob([t],{type:'text/javascript'})));
  sf.postMessage('uci');sf.postMessage('setoption name MultiPV value 2');
}
const sc=m=>m[1]==='mate'?(+m[2]>0?10000-+m[2]:-10000-+m[2]):+m[2];
function look(fen,d){return new Promise(res=>{
  const L={};
  sf.onmessage=e=>{const l=String(e.data);
    if(l.startsWith('info')&&l.includes(' pv ')&&!/bound/.test(l)){
      const m=l.match(/score (cp|mate) (-?\d+)/),k=l.match(/multipv (\d+)/);
      if(m)L[k?+k[1]:1]=sc(m);
    }else if(l.startsWith('bestmove'))res({cp:L[1]??0,cp2:L[2],best:l.split(' ')[1]});
  };
  sf.postMessage('position fen '+fen);sf.postMessage('go depth '+d);
});}

function classify(mv,fens,pos){
  const cls=[],loss=[];
  mv.forEach((m,k)=>{
    const wb=win(pos[k].cp),wa=win(-pos[k+1].cp),l=Math.max(0,wb-wa);
    let c=uci(m)===pos[k].best?'best':l<2?'excellent':l<5?'good':l<10?'inacc':l<20?'mistake':'blunder';
    if((c==='best'||c==='excellent')&&l<2&&VAL[m.piece]>=3&&VAL[m.piece]<99&&wb<85&&wa>=45){
      const att=new Chess(fens[k+1]).moves({verbose:true}).filter(x=>x.to===m.to&&x.captured).map(x=>VAL[x.piece]);
      if(att.length&&Math.min(...att)<VAL[m.piece])c='brilliant';
    }
    if(c==='best'&&pos[k].cp2!==undefined&&win(pos[k].cp)-win(pos[k].cp2)>=20&&wb>20&&wb<85)c='great';
    cls.push(c);loss.push(l);
  });
  return{cls,loss};
}

$('#go').onclick=async()=>{
  const st=$('#st'),g=new Chess();
  if(!g.load_pgn($('#pgn').value.trim(),{sloppy:true})){st.textContent='الـPGN غير صالح.';return}
  const mv=g.history({verbose:true});
  if(!mv.length){st.textContent='ما في نقلات في هذا الـPGN.';return}
  $('#go').disabled=true;
  try{
    st.textContent='جارٍ تحميل المحرك…';await engine();
    const h=g.header(),r=new Chess(),fens=[r.fen()];
    for(const m of mv){r.move({from:m.from,to:m.to,promotion:m.promotion});fens.push(r.fen());}
    const d=+$('#depth').value,pos=[];
    for(let i=0;i<=mv.length;i++){
      st.textContent=`جارٍ التحليل ${i+1}/${mv.length+1}`;
      pos.push(i===mv.length&&r.game_over()?{cp:r.in_checkmate()?-10000:0,best:null}:await look(fens[i],d));
    }
    const{cls,loss}=classify(mv,fens,pos);
    S={moves:mv,fens,pos,cls,loss,k:0,flip:false,ex:{},names:[h.White||'أبيض',h.Black||'أسود']};
    summary();$('#ml').innerHTML=mv.map((m,i)=>(i%2?'':`<span class="n">${i/2+1}.</span>`)+`<button data-k="${i+1}" style="--c:${CL[cls[i]][1]}">${m.san}</button>`).join('');
    $('#rv').hidden=false;st.textContent='اكتمل التحليل.';show(0);
    $('#rv').scrollIntoView({behavior:'smooth'});
  }catch(e){st.textContent='حدث خطأ أثناء التحليل. جرّب مرة ثانية.'}
  $('#go').disabled=false;
};

const whiteCp=k=>(S.fens[k].split(' ')[1]==='w'?1:-1)*S.pos[k].cp;
function bestSan(k){
  const b=S.pos[k].best;if(!b)return'';
  const c=new Chess(S.fens[k]),m=c.move({from:b.slice(0,2),to:b.slice(2,4),promotion:b[4]});
  return m?m.san:b;
}
function summary(){
  const acc=c=>{const a=S.moves.map((m,i)=>m.color===c?Math.min(100,Math.max(0,103.1668*Math.exp(-0.04354*S.loss[i])-3.1669)):null).filter(x=>x!==null);return a.length?Math.round(a.reduce((x,y)=>x+y)/a.length):'–'};
  const n=(c,t)=>S.moves.filter((m,i)=>m.color===c&&S.cls[i]===t).length;
  $('#sum').innerHTML=`<table><tr><th></th><th>${S.names[0]}</th><th>${S.names[1]}</th></tr><tr><td>الدقة</td><td>${acc('w')}%</td><td>${acc('b')}%</td></tr>`+
    Object.keys(CL).map(t=>`<tr><td><span class="dot" style="background:${CL[t][1]}"></span>${CL[t][2]}</td><td>${n('w',t)}</td><td>${n('b',t)}</td></tr>`).join('')+'</table>';
  const N=S.moves.length,pts=S.pos.map((_,i)=>`${i/N*600},${80-win(whiteCp(i))*.8}`);
  S.gp=pts;
}
function graph(){
  const N=S.moves.length,x=S.k/N*600;
  $('#gr').innerHTML=`<polygon points="0,80 ${S.gp.join(' ')} 600,80" fill="#8a8f8c" opacity=".55"/><polyline points="${S.gp.join(' ')}" fill="none" stroke="#2f5d50" stroke-width="1.5" vector-effect="non-scaling-stroke"/><line x1="${x}" x2="${x}" y1="0" y2="80" stroke="#c83431" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}
function show(k){
  S.k=Math.max(0,Math.min(S.moves.length,k));k=S.k;
  const rows=S.fens[k].split(' ')[0].split('/').map(r=>r.replace(/\d/g,x=>'.'.repeat(+x)));
  const lm=k?S.moves[k-1]:null,c=k?S.cls[k-1]:null;
  let h='';
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rr=S.flip?7-r:r,ff=S.flip?7-f:f,sq='abcdefgh'[ff]+(8-rr),p=rows[rr][ff];
    const hl=lm&&(sq===lm.from||sq===lm.to);
    h+=`<div class="sq ${(rr+ff)%2?'d':'l'}${hl?' hl':''}">`+(p!=='.'?`<i class="${p===p.toUpperCase()?'w':'b'}">${GL[p.toLowerCase()]}</i>`:'')+(lm&&sq===lm.to?`<b class="bdg" style="background:${CL[c][1]}">${CL[c][0]}</b>`:'')+'</div>';
  }
  $('#cells').innerHTML=h;
  let a='',info='البداية';
  const w=whiteCp(k);
  $('#evw').style.height=win(w)+'%';
  $('#ev').style.flexDirection=S.flip?'column':'column-reverse';
  if(k){
    const m=S.moves[k-1],b=S.pos[k-1].best,bs=bestSan(k-1);
    info=`${Math.ceil(k/2)}${k%2?'.':'...'} ${m.san} — ${CL[c][2]} <small>التقييم ${fmt(w)}`+(!['best','brilliant','great'].includes(c)&&bs?` · الأفضل: ${bs}`:'')+'</small>';
    if(!['best','brilliant','great'].includes(c)&&b){
      const P=s=>[(S.flip?7-'abcdefgh'.indexOf(s[0]):'abcdefgh'.indexOf(s[0]))+.5,(S.flip?+s[1]-1:8-s[1])+.5];
      const[x1,y1]=P(b.slice(0,2)),[x2,y2]=P(b.slice(2,4));
      a=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7aa33a" stroke-width=".2" stroke-linecap="round" opacity=".85"/><circle cx="${x2}" cy="${y2}" r=".25" fill="#7aa33a" opacity=".85"/>`;
    }
  }
  $('#ar').innerHTML=a;$('#info').innerHTML=info;
  $('#top').textContent=(S.flip?'⚪ ':'⚫ ')+S.names[S.flip?0:1];
  $('#bot').textContent=(S.flip?'⚫ ':'⚪ ')+S.names[S.flip?1:0];
  $('#ex').textContent=S.ex[k]||'';$('#exb').hidden=!k;
  document.querySelectorAll('#ml button').forEach(x=>x.classList.toggle('on',+x.dataset.k===k));
  const on=document.querySelector('#ml button.on');if(on)on.scrollIntoView({block:'nearest'});
  graph();
}
$('#b0').onclick=()=>show(0);$('#b1').onclick=()=>show(S.k-1);
$('#b2').onclick=()=>show(S.k+1);$('#b3').onclick=()=>show(1e9);
$('#fl').onclick=()=>{S.flip=!S.flip;show(S.k)};
$('#ml').onclick=e=>{const b=e.target.closest('button');if(b)show(+b.dataset.k)};
$('#gr').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();show(Math.round((e.clientX-r.left)/r.width*S.moves.length))};
document.addEventListener('keydown',e=>{if(!S||/TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowLeft')show(S.k+1);if(e.key==='ArrowRight')show(S.k-1);});

$('#exb').onclick=async()=>{
  const k=S.k,box=$('#ex');if(!k)return;
  if(S.ex[k]){box.textContent=S.ex[k];return}
  box.textContent='جارٍ الشرح…';
  try{
    const m=S.moves[k-1];
    const r=await fetch('/api/explain',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
      fen:S.fens[k-1],color:m.color==='w'?'الأبيض':'الأسود',played:m.san,cls:CL[S.cls[k-1]][2],best:bestSan(k-1),
      before:(S.pos[k-1].cp/100).toFixed(1),after:(-S.pos[k].cp/100).toFixed(1)})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'تعذّر الشرح');
    S.ex[k]=d.text;if(S.k===k)box.textContent=d.text;
  }catch(e){if(S.k===k)box.textContent=e.message||'تعذّر الشرح'}
};
</script>
</body>
</html>
